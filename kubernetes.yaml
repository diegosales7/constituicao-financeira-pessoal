# Kubernetes Manifest Simplificado
# Para deploy completo com frontend, backend e banco de dados
# 
# Aplicar com: kubectl apply -f kubernetes.yaml
# Remover com: kubectl delete -f kubernetes.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: financas
  labels:
    app: constitucao-financeira

---
# Secrets (configurar com seus valores reais!)
apiVersion: v1
kind: Secret
metadata:
  name: financas-secrets
  namespace: financas
type: Opaque
stringData:
  db-username: postgres
  db-password: MUDAR-SENHA-SUPER-SEGURA-AQUI-32-CHARS
  jwt-secret: MUDAR-JWT-SECRET-ALEATORIO-32-CHARS
  cors-origins: "https://seu-dominio.com,https://www.seu-dominio.com"

---
# ConfigMap para nginx
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: financas
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      sendfile on;
      gzip on;
      gzip_types text/plain text/css text/javascript application/json;
      
      server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
          expires 30d;
          add_header Cache-Control "public, immutable";
        }
        
        location /api {
          proxy_pass http://backend-service:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }

---
# Frontend Deployment (Nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: financas
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: html
        emptyDir: {}
      - name: config
        configMap:
          name: nginx-config

---
# Frontend Service (LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: financas
  labels:
    app: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: frontend

---
# Backend Deployment (Java Spring Boot)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: financas
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: default
      containers:
      - name: backend
        image: seu-registry.br.ocir.io/seu-namespace/financas-backend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DB_URL
          value: "jdbc:postgresql://postgres-service:5432/financas_pessoais"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: financas-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: financas-secrets
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: financas-secrets
              key: jwt-secret
        - name: CORS_ORIGINS
          valueFrom:
            secretKeyRef:
              name: financas-secrets
              key: cors-origins
        - name: JAVA_OPTS
          value: "-Xmx1024m -Xms512m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Resources
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

---
# Backend Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: financas
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: backend

---
# PostgreSQL StatefulSet (para desenvolvimento/pequena escala)
# Para produção, usar OCI PostgreSQL Database Service
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: financas
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "financas_pessoais"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: financas-secrets
              key: db-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: financas-secrets
              key: db-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        
        # Health check
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 5
          periodSeconds: 5
        
        # Resources
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        
        # Volume
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

---
# PostgreSQL Service (Headless)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: financas
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres

---
# HorizontalPodAutoscaler para Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: financas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60

---
# HorizontalPodAutoscaler para Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: financas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85

---
# NetworkPolicy (opcional - para melhor segurança)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: financas-network-policy
  namespace: financas
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

