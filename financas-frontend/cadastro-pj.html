<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro PJ - Constituição Financeira</title>
    <link rel="stylesheet" href="CSS/style.css?v=2">
</head>
<body class="pj-theme">

<div class="auth-page pj-auth">
    <div class="auth-card pj-auth-card" style="max-width: 840px;">
        <div class="auth-header pj-auth-header">
            <h1>Criar conta PJ</h1>
            <p>Cadastre a empresa, o responsável financeiro e a estrutura de governança corporativa.</p>
        </div>

        <div class="auth-body">
            <div id="mensagemCadastroPj" class="auth-message"></div>

            <form id="formCadastroPj">
                <section class="card pj-card">
                    <h2>🏢 Dados da empresa</h2>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Razão social</label>
                            <input type="text" id="cadastroEmpresaNome" required>
                        </div>

                        <div class="form-group">
                            <label>Nome fantasia</label>
                            <input type="text" id="cadastroEmpresaFantasia">
                        </div>
                    </div>

                    <div class="grid grid-3">
                        <div class="form-group">
                            <label>CNPJ</label>
                            <input type="text" id="cadastroCnpj" placeholder="00.000.000/0001-00">
                        </div>

                        <div class="form-group">
                            <label>Ramo / segmento</label>
                            <input type="text" id="cadastroRamo" placeholder="Ex: Tecnologia, varejo, serviços">
                        </div>

                        <div class="form-group">
                            <label>Porte</label>
                            <select id="cadastroPorte">
                                <option value="">Selecione</option>
                                <option value="Microempresa">Microempresa</option>
                                <option value="Pequena">Pequena</option>
                                <option value="Média">Média</option>
                                <option value="Grande">Grande</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" id="cadastroEndereco" placeholder="Rua, número, bairro">
                        </div>

                        <div class="form-group">
                            <label>Cidade / UF</label>
                            <input type="text" id="cadastroCidadeUf" placeholder="Ex: São Paulo / SP">
                        </div>
                    </div>
                </section>

                <section class="card pj-card">
                    <h2>👤 Responsável financeiro</h2>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Nome completo</label>
                            <input type="text" id="cadastroResponsavelNome" required>
                        </div>

                        <div class="form-group">
                            <label>Cargo</label>
                            <input type="text" id="cadastroCargo" placeholder="Diretor financeiro, gestor, sócio">
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>E-mail corporativo</label>
                            <input type="email" id="cadastroEmailCorp" required>
                        </div>

                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="text" id="cadastroTelefoneCorp" placeholder="(11) 99999-9999">
                        </div>
                    </div>
                </section>

                <section class="card pj-card">
                    <h2>🔐 Acesso e governança</h2>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Senha de acesso</label>
                            <input type="password" id="cadastroSenhaPj" required>
                        </div>

                        <div class="form-group">
                            <label>Confirmar senha</label>
                            <input type="password" id="cadastroConfirmarSenhaPj" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Política financeira da empresa</label>
                        <textarea id="cadastroPoliticaFinanceira" placeholder="Descreva a visão da tesouraria, liquidez, capital de giro e controles financeiros da empresa."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Cadastrar empresa no ambiente PJ
                    </button>
                </section>
            </form>

            <div class="auth-footer">
                Já possui conta?
                <a href="login-pj.html">Entrar no ambiente PJ</a>
            </div>
        </div>
    </div>
</div>

<script src="./js/auth-pj.js"></script>
</body>
</html>
