<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Constituição Financeira</title>

    <link rel="stylesheet" href="CSS/style.css?v=2">
</head>
<body>

<div class="auth-page">

    <div class="auth-card" style="max-width: 760px;">

        <div class="auth-header">
            <h1>📝 Criar Conta</h1>
            <p>Cadastre seu perfil pessoal, profissional e financeiro</p>
        </div>

        <div class="auth-body">

            <div id="mensagemCadastro" class="auth-message"></div>

            <form id="formCadastro">

                <section class="card">
                    <h2>👤 Dados Pessoais</h2>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Nome</label>
                            <input type="text" id="cadastroNome" required>
                        </div>

                        <div class="form-group">
                            <label>Sobrenome</label>
                            <input type="text" id="cadastroSobrenome">
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>E-mail</label>
                            <input type="email" id="cadastroEmail" required>
                        </div>

                        <div class="form-group">
                            <label>Idade</label>
                            <input type="number" id="cadastroIdade" min="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" id="cadastroTelefone">
                    </div>
                </section>

                <section class="card">
                    <h2>💼 Informações Profissionais</h2>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Profissão</label>
                            <input type="text" id="cadastroProfissao">
                        </div>

                        <div class="form-group">
                            <label>Cargo</label>
                            <input type="text" id="cadastroCargo">
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Empresa</label>
                            <input type="text" id="cadastroEmpresa">
                        </div>

                        <div class="form-group">
                            <label>Escolaridade</label>
                            <input type="text" id="cadastroEscolaridade">
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>🏠 Endereço</h2>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" id="cadastroEndereco">
                        </div>

                        <div class="form-group">
                            <label>Número</label>
                            <input type="text" id="cadastroNumero">
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Complemento</label>
                            <input type="text" id="cadastroComplemento">
                        </div>

                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="cadastroBairro">
                        </div>
                    </div>

                    <div class="grid grid-3">
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="cadastroCidade">
                        </div>

                        <div class="form-group">
                            <label>Estado</label>
                            <input type="text" id="cadastroEstado">
                        </div>

                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="cadastroCep">
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>🔐 Acesso</h2>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="cadastroSenha" required>
                        </div>

                        <div class="form-group">
                            <label>Confirmar senha</label>
                            <input type="password" id="cadastroConfirmarSenha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Cadastrar no Banco de Dados
                    </button>
                </section>

            </form>

            <div class="auth-footer">
                Já tem conta?
                <a href="index.html">Entrar</a>
            </div>

        </div>

    </div>

</div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</body>
</html>
