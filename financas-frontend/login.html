<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Constituição Financeira</title>
    <link rel="stylesheet" href="CSS/style.css?v=2">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>💰 Constituição Financeira</h1>
            <p id="loginSubtitle">Entre para acessar seu sistema financeiro pessoal</p>
            <div class="auth-info-link">
                <a href="sobre.html" class="info-link">
                    ℹ️ Saiba como funciona a Constituição Financeira Pessoal
                </a>
            </div>
        </div>

        <div class="auth-body">
            <div id="mensagemLogin" class="auth-message"></div>
            <form id="formLogin">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Entrar
                </button>
            </form>

            <div class="auth-footer">
                Ainda não tem conta?
                <a href="cadastro.html">Criar cadastro</a>
            </div>
        </div>
    </div>
</div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const context = params.get('context');
    if (context === 'pj') {
        document.getElementById('loginSubtitle').textContent = 'Entre para acessar a gestão financeira empresarial';
    }
</script>
</body>
</html>
