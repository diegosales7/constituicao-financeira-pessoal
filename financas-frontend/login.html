<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Constituição Financeira</title>
    <link rel="stylesheet" href="CSS/style.css?v=2">
</head>
<body class="pf-theme">

<div class="auth-page pf-auth">
    <div class="auth-card pf-auth-card" id="authCard">
        <div class="auth-header pf-auth-header">
            <h1>Constituição Financeira</h1>
            <p id="loginSubtitle">Entre para acessar seu sistema financeiro pessoal</p>
            <div class="pf-register-banner">
                <span class="pf-banner-pill">Controle inteligente</span>
                <span class="pf-banner-pill">Planejamento claro</span>
                <span class="pf-banner-pill">Gestão moderna</span>
            </div>
            <div class="auth-info-link">
                <a href="sobre.html" class="info-link">
                    Saiba como funciona a Constituição Financeira Pessoal
                </a>
            </div>
        </div>

        <div class="auth-body">
            <div id="mensagemLogin" class="auth-message"></div>
            <form id="formLogin">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Entrar
                </button>
            </form>

            <div class="auth-footer">
                Ainda não tem conta?
                <a href="cadastro.html" id="cadastroLink">Criar cadastro</a>
            </div>
        </div>
    </div>
</div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const context = params.get('context');
    const authCard = document.getElementById('authCard');

    if (context === 'pj') {
        window.location.href = 'login-pj.html';
        return;
    }

    if (context === 'pf') {
        document.getElementById('loginSubtitle').textContent = 'Entre para acessar seu sistema financeiro pessoal';
    }
</script>
</body>
</html>
